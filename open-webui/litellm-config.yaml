model_list:
  - model_name: claude-opus-4-6 # Open WebUI'da göreceğiniz isim
    litellm_params:
      model: anthropic/claude-opus-4-6 # LiteLLM'e bunun bir Anthropic modeli olduğunu söylüyoruz
      api_key: sk-a9d573d7717ad87b30486970eb609e17c6fcb2be487ca56ef3db5e3050399307
      api_base: https://api.yuxor.tech # Yuxor yönlendirmesi
      custom_headers:
        anthropic-beta: output-128k-2025-02-19 # 1M context ve yüksek output için zorunlu
        anthropic-version: 2023-06-01
      max_tokens: 16384
      # Thinking özelliğini aktifleştirmek için varsayılan ek parametreler
      extra_body:
        thinking:
          type: "enabled"
          budget_tokens: 8192

# (İsteğe bağlı) LiteLLM'in genel proxy ayarları
litellm_settings:
  drop_params: true # Modelin desteklemediği OpenAI parametrelerini (örn: presence_penalty) düşürür